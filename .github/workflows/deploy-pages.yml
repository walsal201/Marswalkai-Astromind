name: Deploy AstroMind to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AstroMind for the repository URL
        run: pnpm --filter @workspace/astromind run build
        env:
          BASE_PATH: /Marswalkai-Astromind/
          NODE_ENV: production
          PORT: "4173"

      - name: Point the static app to its live API
        run: |
          printf '%s\n' "window.ASTROMIND_API_BASE = 'https://astro-mind-space-mission-suite--astromindnasa.replit.app/astro-api';" \
            > artifacts/astromind/dist/public/runtime-config.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/astromind/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
